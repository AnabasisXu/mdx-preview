name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --release
      - name: Build prev
        run: cargo build --locked --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prev-linux-x86_64
          path: target/release/prev
      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build prev (static musl)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: prev-linux-musl-x86_64
          path: target/x86_64-unknown-linux-musl/release/prev

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m pip install --user ziglang || python3 -m pip install --user --break-system-packages ziglang
          ZIG=$(python3 -c 'import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')
          chmod +x "$ZIG"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$ZIG" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version
          cargo install cargo-zigbuild --locked
      - name: Build prev.exe
        run: cargo zigbuild --locked --release --target x86_64-pc-windows-gnu
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: prev-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/prev.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          mkdir -p out
          cp dist/prev-linux-x86_64/prev "out/prev-${tag}-linux-x86_64"
          cp dist/prev-linux-musl-x86_64/prev "out/prev-${tag}-linux-x86_64-musl"
          cp dist/prev-windows-x86_64/prev.exe "out/prev-${tag}-windows-x86_64.exe"
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/* --title "prev $tag" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
