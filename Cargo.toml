[package]
name = "prev"
version = "0.2.2"
edition = "2021"
description = "Single-file MDict (.mdx/.mdd) viewer with multi-dictionary support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnabasisXu/prev"
readme = "README.md"

[[bin]]
name = "prev"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-ws = "0.3"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
flate2 = "1"
ripemd = "0.1"
encoding_rs = "0.8"
percent-encoding = "2"
memmap2 = "0.9"
notify = "6"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
