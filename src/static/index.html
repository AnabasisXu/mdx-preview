<!DOCTYPE html>
<html>

<head>
    <title>Preview</title>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/dist/site.css">
    <script src="/dist/utils.js" defer></script>
</head>

<body>
    <aside id="sidebar">
        <div id="search-row">
            <input type="text" id="query" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>
        <div id="word-list" role="listbox"></div>
        <div id="status"></div>
    </aside>
    <div id="splitter" role="separator" aria-orientation="vertical" title="拖动调整宽度，双击复位"></div>
    <main id="pane">
        <div id="toolbar">
            <button type="button" id="zoom-out" title="缩小字号">A-</button>
            <button type="button" id="zoom-in" title="放大字号">A+</button>
        </div>
        <iframe id="entry" src="about:blank" title="词条"></iframe>
    </main>
</body>

</html>
