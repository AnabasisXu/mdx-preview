<!DOCTYPE html>
<html>

<head>
    <title>Preview</title>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/dist/site.css">
    <script src="/dist/utils.js" defer></script>
</head>

<body>
    <aside id="sidebar">
        <div id="search-row">
            <input type="text" id="query" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
            <button type="button" id="sort-btn" title="切换词头顺序">↑</button>
        </div>
        <div id="dict-row">
            <button type="button" id="dict-btn" title="切换词典 (Ctrl+P)">…</button>
        </div>
        <div id="dict-pop" hidden>
            <input type="text" id="dict-filter" autocomplete="off" spellcheck="false" />
            <div id="dict-list" role="listbox" tabindex="-1"></div>
        </div>
        <div id="initials"></div>
        <div id="word-list" role="listbox"></div>
        <div id="status"></div>
    </aside>
    <div id="splitter" role="separator" aria-orientation="vertical" title="拖动调整宽度，双击复位"></div>
    <main id="pane">
        <iframe id="entry" src="about:blank" title="词条"></iframe>
    </main>
</body>

</html>
