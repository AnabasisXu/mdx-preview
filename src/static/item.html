<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Relative image/CSS references resolve into the .mdd resource route. -->
    <base href="{res}" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            padding: 16px 20px 48px;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.7;
            color: #1f2328;
            background: #fff;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        #headword {
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            color: #12314f;
        }

        #entry-body img {
            max-width: 100%;
            height: auto;
        }

        #entry-body table {
            max-width: 100%;
            border-collapse: collapse;
        }

        #entry-body td,
        #entry-body th {
            padding: 3px 8px;
            border: 1px solid #d0d7de;
            vertical-align: top;
        }

        #entry-body th {
            background: #f6f8fa;
        }

        #entry-body h1,
        #entry-body h2,
        #entry-body h3 {
            margin: 14px 0 8px;
            line-height: 1.35;
        }

        #entry-body ul,
        #entry-body ol {
            padding-left: 1.6em;
        }

        #entry-body blockquote {
            margin: 8px 0;
            padding-left: 12px;
            color: #57606a;
            border-left: 3px solid #d0d7de;
        }

        #entry-body pre {
            padding: 10px;
            overflow: auto;
            background: #f6f8fa;
        }

        #entry-body a {
            color: #0969da;
            text-decoration: none;
        }

        #entry-body a:hover {
            text-decoration: underline;
        }

        #entry-body hr {
            margin: 14px 0;
            border: 0;
            border-top: 1px solid #d8dee4;
        }
    </style>
</head>

<body>
    <h1 id="headword">{title}</h1>
    <div id="entry-body">{attributes}</div>
    <script>
        // <base> would otherwise send in-page anchors to the resource route.
        document.addEventListener('click', function (e) {
            var a = e.target && e.target.closest ? e.target.closest('a') : null;
            if (!a) return;
            var href = a.getAttribute('href') || '';
            if (href.charAt(0) !== '#') return;
            var target = document.getElementById(href.slice(1));
            if (target) {
                e.preventDefault();
                target.scrollIntoView();
            }
        });
        // This pane is read-only; keyboard focus belongs to the shell, where the
        // app's shortcuts and Surfingkeys listen. Clicking text would otherwise
        // move focus into this frame and silently disable them. A drag that
        // selects text keeps focus here so Ctrl+C still copies the entry.
        document.addEventListener('mouseup', function () {
            var sel = window.getSelection();
            if (sel && !sel.isCollapsed) return;
            setTimeout(function () {
                try { parent.focus(); } catch (e) { }
            }, 0);
        }, true);
    </script>
</body>

</html>
